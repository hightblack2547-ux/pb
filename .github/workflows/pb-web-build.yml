name: Check static Safari / Netlify build
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pb-web-build.yml
      - netlify.toml
      - scripts/build-netlify.sh
      - web-ui/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build same static site as Netlify
        run: bash scripts/build-netlify.sh
      - name: Verify static bundle
        shell: bash
        run: |
          test -f webport/dist/index.html
          test -f webport/dist/launcher/index.html
          test -f webport/dist/launcher/app.js
          test -f webport/dist/map3d/index.html
          test -n "$(find webport/dist/map3d -type f -name '*.js' -print -quit)"
          echo '## PB Webport static build' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Actions executed scripts/build-netlify.sh, same build as Netlify.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No original Point Blank assets included or published.' >> "$GITHUB_STEP_SUMMARY"
          du -sh webport/dist >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static Netlify bundle (NO GAME ASSETS)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pb-webport-shell-netlify
          path: webport/dist/
          if-no-files-found: error
          retention-days: 7
