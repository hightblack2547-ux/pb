name: Check static Safari / Netlify build
on:
  push:
    branches: [main]
    paths:
      - netlify.toml
      - scripts/build-netlify.sh
      - .github/workflows/pb-web-build.yml
      - web-ui/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the same static site as Netlify
        run: bash scripts/build-netlify.sh
      - name: Verify Netlify public paths
        shell: bash
        run: |
          test -s webport/dist/launcher/index.html
          test -s webport/dist/map3d/index.html
          test -s webport/dist/training/index.html
          echo '## Same build script used by Netlify' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build: bash scripts/build-netlify.sh' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publish: webport/dist' >> "$GITHUB_STEP_SUMMARY"
          echo 'No proprietary Point Blank assets included.' >> "$GITHUB_STEP_SUMMARY"
          du -sh webport/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload static demo artifact without licensed game assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pb-webport-netlify-build
          path: webport/dist/
          if-no-files-found: error
          retention-days: 7
